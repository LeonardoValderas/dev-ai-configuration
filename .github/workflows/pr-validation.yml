name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      # The repo has no dependencies and no lockfile, so there is no install step.
      - name: Test
        run: npm test
      - name: Validate
        run: npm run validate
      # This job runs on Linux. The Phase 2G.1 REAL-OS/REAL-CLAUDE sandbox tests need macOS
      # sandbox-exec and are SKIPPED here, so a green run is NOT macOS runtime verification.
      # This step prints that state explicitly; see docs/claude-code-adapter.md.
      - name: Phase 2G.1 runtime evidence state (Linux CI is not macOS runtime verification)
        run: node tests/support/runtime-evidence.mjs
